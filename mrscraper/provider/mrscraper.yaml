identity:
  author: ai-mrscraper
  name: mrscraper
  label:
    en_US: MrScraper
  description:
    en_US: MrScraper Status, Scrape HTML, Scrape Markdown, Get screenshot, Scrape brand, Scrape JSON,
      and Web search.
  icon: icon.svg
  tags:
  - search
  - utilities
credentials_for_provider:
  api_token:
    type: secret-input
    required: true
    label:
      en_US: API Token
    placeholder:
      en_US: Enter your MrScraper API token
    help:
      en_US: Create or copy an API token from your MrScraper account.
    url: https://app.mrscraper.com
tools:
- tools/mrscraper_status.yaml
- tools/mrscraper_scrape_html.yaml
- tools/mrscraper_scrape_markdown.yaml
- tools/mrscraper_get_screenshot.yaml
- tools/mrscraper_scrape_brand.yaml
- tools/mrscraper_scrape_json.yaml
- tools/mrscraper_web_search.yaml
extra:
  python:
    source: provider/mrscraper.py
