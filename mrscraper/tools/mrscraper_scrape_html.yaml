identity:
  name: mrscraper_scrape_html
  author: ai-mrscraper
  label:
    en_US: Scrape HTML
description:
  human:
    en_US: Retrieve the raw HTML of a page. Browser rendering is optional.
  llm: Retrieve the raw HTML of a page. Browser rendering is optional.
parameters:
- name: url
  type: string
  required: true
  label:
    en_US: URL
  human_description:
    en_US: Absolute HTTP or HTTPS URL of the page to process.
  llm_description: Absolute HTTP or HTTPS URL of the page to process.
  form: llm
- name: browser_rendering
  type: select
  required: false
  label:
    en_US: Browser Rendering
  human_description:
    en_US: 'Whether to load the page in a browser: true always does and false never does. Omit it to load
      the page without a browser first and switch to a browser automatically if the request is blocked.'
  llm_description: 'Whether to load the page in a browser: true always does and false never does. Omit
    it to load the page without a browser first and switch to a browser automatically if the request is
    blocked.'
  form: llm
  default: auto
  options:
  - value: auto
    label:
      en_US: Auto
  - value: 'true'
    label:
      en_US: Always
  - value: 'false'
    label:
      en_US: Never
- name: timeout
  type: number
  required: false
  label:
    en_US: Timeout
  human_description:
    en_US: Maximum seconds to wait for the scrape, from 1 to 330. The HTTP request allows 30 additional
      seconds.
  llm_description: Maximum seconds to wait for the scrape, from 1 to 330. The HTTP request allows 30 additional
    seconds.
  form: llm
  default: 300
  min: 1
  max: 330
  precision: 0
- name: warm_start
  type: boolean
  required: false
  label:
    en_US: Warm Start
  human_description:
    en_US: Whether to open the site's home page first to warm the session before loading the target URL.
  llm_description: Whether to open the site's home page first to warm the session before loading the target
    URL.
  form: llm
  default: false
- name: block_resources
  type: boolean
  required: false
  label:
    en_US: Block Resources
  human_description:
    en_US: Whether to block images, fonts, and stylesheets while loading the page.
  llm_description: Whether to block images, fonts, and stylesheets while loading the page.
  form: llm
  default: false
- name: wait_for_selector
  type: string
  required: false
  label:
    en_US: Wait For Selector
  human_description:
    en_US: CSS selector or text to wait for on the page before returning the result, up to 500 characters.
  llm_description: CSS selector or text to wait for on the page before returning the result, up to 500
    characters.
  form: llm
- name: geo_code
  type: string
  required: false
  label:
    en_US: Geo Code
  human_description:
    en_US: Two-letter country code to load the page from, sent in lowercase.
  llm_description: Two-letter country code to load the page from, sent in lowercase.
  form: llm
- name: max_age
  type: number
  required: false
  label:
    en_US: Max Age
  human_description:
    en_US: Return a cached result of the same request when it is newer than the selected age. A cached
      result costs the same tokens as the original scrape.
  llm_description: Return a cached result of the same request when it is newer than the selected age.
    A cached result costs the same tokens as the original scrape.
  form: llm
  default: 0
  min: 0
  max: 604800000
  precision: 0
- name: max_retries
  type: number
  required: false
  label:
    en_US: Max Retries
  human_description:
    en_US: Maximum number of retries, as a nonnegative integer. Omit this parameter for no limit.
  llm_description: Maximum number of retries, as a nonnegative integer. Omit this parameter for no limit.
  form: llm
  min: 0
  precision: 0
- name: screenshot
  type: string
  required: false
  label:
    en_US: Screenshot
  human_description:
    en_US: 'Screenshot to capture with the HTML: false for none, full for the entire page, top for the
      first viewport, or a WIDTHxHEIGHT viewport from 100 to 3840 pixels with an optional -ZOOM percent
      from 25 to 300, such as 1280x800 or 1920x1080-75. Setting a screenshot also sends browserRendering=true.'
  llm_description: 'Screenshot to capture with the HTML: false for none, full for the entire page, top
    for the first viewport, or a WIDTHxHEIGHT viewport from 100 to 3840 pixels with an optional -ZOOM
    percent from 25 to 300, such as 1280x800 or 1920x1080-75. Setting a screenshot also sends browserRendering=true.'
  form: llm
  default: 'false'
extra:
  python:
    source: tools/mrscraper_scrape_html.py
