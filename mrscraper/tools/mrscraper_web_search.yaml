identity:
  name: mrscraper_web_search
  author: ai-mrscraper
  label:
    en_US: Web Search
description:
  human:
    en_US: Search the web to retrieve real-time search results, including relevant website URLs, titles, descriptions, and related questions based on a given query. Disable raw to request JSON.
  llm: Search the web to retrieve real-time search results, including relevant website URLs, titles, descriptions, and related questions based on a given query. Disable raw to request JSON.
parameters:
- name: url
  type: string
  required: true
  label:
    en_US: Search Query
  human_description:
    en_US: The search query.
  llm_description: The search query.
  form: llm
- name: raw
  type: boolean
  required: false
  label:
    en_US: Raw HTML
  human_description:
    en_US: Return HTML regardless of format when enabled. Disable for JSON.
  llm_description: Return HTML regardless of format when enabled. Disable for JSON.
  form: llm
  default: true
- name: format
  type: select
  required: false
  label:
    en_US: Format
  human_description:
    en_US: Response format when raw is false.
  llm_description: Response format when raw is false.
  form: llm
  default: json
  options:
  - value: json
    label:
      en_US: JSON
  - value: html
    label:
      en_US: HTML
- name: region
  type: string
  required: false
  label:
    en_US: Region
  human_description:
    en_US: Optional country code for search results.
  llm_description: Optional country code for search results.
  form: llm
- name: language
  type: string
  required: false
  label:
    en_US: Language
  human_description:
    en_US: Optional language code for search results.
  llm_description: Optional language code for search results.
  form: llm
- name: page
  type: number
  required: false
  label:
    en_US: Page
  human_description:
    en_US: Results page number, starting at 1.
  llm_description: Results page number, starting at 1.
  form: llm
  min: 1
  precision: 0
- name: render_js
  type: boolean
  required: false
  label:
    en_US: Render JavaScript
  human_description:
    en_US: Render search features that depend on JavaScript.
  llm_description: Render search features that depend on JavaScript.
  form: llm
  default: false
- name: timeout
  type: number
  required: false
  label:
    en_US: Timeout
  human_description:
    en_US: Search request timeout in seconds. Defaults to 600.
  llm_description: Search request timeout in seconds. Defaults to 600.
  form: llm
  default: 600
  min: 0.1
extra:
  python:
    source: tools/mrscraper_web_search.py
