identity:
  name: mrscraper_web_search
  author: ai-mrscraper
  label:
    en_US: Web search
description:
  human:
    en_US: Search the web and return ranked results with titles, URLs, descriptions, and sources.
  llm: Search the web and return ranked results with titles, URLs, descriptions, and sources.
parameters:
- name: query
  type: string
  required: true
  label:
    en_US: Query
  human_description:
    en_US: Search query text, trimmed before sending, containing 1 to 1000 characters.
  llm_description: Search query text, trimmed before sending, containing 1 to 1000 characters.
  form: llm
- name: country
  type: string
  required: false
  label:
    en_US: Country
  human_description:
    en_US: Two-letter country code to search from, sent in lowercase.
  llm_description: Two-letter country code to search from, sent in lowercase.
  form: llm
  default: us
- name: num_results
  type: number
  required: false
  label:
    en_US: Number of Results
  human_description:
    en_US: Number of search results to request, as an integer from 10 to 100. Fewer results may be returned.
  llm_description: Number of search results to request, as an integer from 10 to 100. Fewer results may
    be returned.
  form: llm
  default: 10
  min: 10
  max: 100
  precision: 0
extra:
  python:
    source: tools/mrscraper_web_search.py
