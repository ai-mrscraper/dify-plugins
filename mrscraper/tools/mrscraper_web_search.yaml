identity:
  name: mrscraper_web_search
  author: ai-mrscraper
  label:
    en_US: Web Search
description:
  human:
    en_US: "Search the web for real-time results: website URLs, titles, and descriptions."
  llm: "Search the web for real-time results: website URLs, titles, and descriptions."
parameters:
- name: query
  type: string
  required: true
  label:
    en_US: Search Query
  human_description:
    en_US: The search query.
  llm_description: The search query, for example "python web scraping".
  form: llm
- name: country
  type: string
  required: false
  label:
    en_US: Country
  human_description:
    en_US: Optional country code for localized results, such as us. Leave empty for the service default.
  llm_description: Optional two-letter country code for localized results, such as us. Omit for the service default.
  form: llm
- name: num_results
  type: number
  required: false
  label:
    en_US: Number of Results
  human_description:
    en_US: Number of results to return, from 10 to 100. Defaults to 10.
  llm_description: Number of results to return, an integer from 10 to 100. Defaults to 10.
  form: llm
  default: 10
  min: 10
  max: 100
  precision: 0
extra:
  python:
    source: tools/mrscraper_web_search.py
