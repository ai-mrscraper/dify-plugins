identity:
  name: mrscraper_get_screenshot
  author: ai-mrscraper
  label:
    en_US: Get screenshot
description:
  human:
    en_US: Capture a base64 screenshot of the full page or top viewport. Browser rendering is always enabled.
  llm: Capture a base64 screenshot of the full page or top viewport. Browser rendering is always enabled.
parameters:
- name: url
  type: string
  required: true
  label:
    en_US: URL
  human_description:
    en_US: Absolute HTTP or HTTPS URL of the page to process.
  llm_description: Absolute HTTP or HTTPS URL of the page to process.
  form: llm
- name: timeout
  type: number
  required: false
  label:
    en_US: Timeout
  human_description:
    en_US: Page load timeout in seconds, from 1 to 300. The HTTP request allows 30 additional seconds.
  llm_description: Page load timeout in seconds, from 1 to 300. The HTTP request allows 30 additional
    seconds.
  form: llm
  default: 300
  min: 1
  max: 300
  precision: 0
- name: geo_code
  type: string
  required: false
  label:
    en_US: Geo Code
  human_description:
    en_US: Two-letter country code to load the page from, sent in lowercase.
  llm_description: Two-letter country code to load the page from, sent in lowercase.
  form: llm
  default: us
- name: proxy_country
  type: string
  required: false
  label:
    en_US: Proxy Country
  human_description:
    en_US: Two-letter country code of the proxy server, sent in lowercase.
  llm_description: Two-letter country code of the proxy server, sent in lowercase.
  form: llm
  default: us
- name: super
  type: boolean
  required: false
  label:
    en_US: Super
  human_description:
    en_US: Whether to route the request through real devices.
  llm_description: Whether to route the request through real devices.
  form: llm
  default: false
- name: wait_until
  type: select
  required: false
  label:
    en_US: Wait Until
  human_description:
    en_US: 'Navigation completion event to wait for: domcontentloaded, load, networkidle0, or networkidle2.'
  llm_description: 'Navigation completion event to wait for: domcontentloaded, load, networkidle0, or
    networkidle2.'
  form: llm
  default: domcontentloaded
  options:
  - value: domcontentloaded
    label:
      en_US: DOM content loaded
  - value: load
    label:
      en_US: Load
  - value: networkidle0
    label:
      en_US: Network idle 0
  - value: networkidle2
    label:
      en_US: Network idle 2
- name: proxy
  type: string
  required: false
  label:
    en_US: Proxy
  human_description:
    en_US: Custom proxy URL used to load the page.
  llm_description: Custom proxy URL used to load the page.
  form: llm
- name: max_retries
  type: number
  required: false
  label:
    en_US: Max Retries
  human_description:
    en_US: Maximum number of retries, as a nonnegative integer. Omit this parameter for no limit.
  llm_description: Maximum number of retries, as a nonnegative integer. Omit this parameter for no limit.
  form: llm
  min: 0
  precision: 0
- name: save_result
  type: boolean
  required: false
  label:
    en_US: Save Result
  human_description:
    en_US: Whether to save the result to the dashboard Result tab.
  llm_description: Whether to save the result to the dashboard Result tab.
  form: llm
  default: false
- name: block_resources
  type: boolean
  required: false
  label:
    en_US: Block Resources
  human_description:
    en_US: Whether to block images, fonts, and stylesheets while loading the page.
  llm_description: Whether to block images, fonts, and stylesheets while loading the page.
  form: llm
  default: false
- name: wait_for_selector
  type: string
  required: false
  label:
    en_US: Wait For Selector
  human_description:
    en_US: Wait for the page to contain the specified CSS selector before returning the result.
  llm_description: Wait for the page to contain the specified CSS selector before returning the result.
  form: llm
- name: return_cookie
  type: boolean
  required: false
  label:
    en_US: Return Cookie
  human_description:
    en_US: Whether to include browser session cookies in the response.
  llm_description: Whether to include browser session cookies in the response.
  form: llm
  default: false
- name: warm_start
  type: boolean
  required: false
  label:
    en_US: Warm Start
  human_description:
    en_US: Whether to enable warm start for more reliable scraping, at the cost of additional latency.
  llm_description: Whether to enable warm start for more reliable scraping, at the cost of additional
    latency.
  form: llm
  default: false
- name: screenshot
  type: select
  required: false
  label:
    en_US: Screenshot
  human_description:
    en_US: 'Screenshot area to capture: full for the entire page or top for the top viewport.'
  llm_description: 'Screenshot area to capture: full for the entire page or top for the top viewport.'
  form: llm
  default: full
  options:
  - value: full
    label:
      en_US: Full page
  - value: top
    label:
      en_US: Top viewport
- name: html
  type: boolean
  required: false
  label:
    en_US: HTML
  human_description:
    en_US: Whether to include the page HTML in the response.
  llm_description: Whether to include the page HTML in the response.
  form: llm
  default: true
- name: markdown
  type: boolean
  required: false
  label:
    en_US: Markdown
  human_description:
    en_US: Whether to include the page Markdown in the response.
  llm_description: Whether to include the page Markdown in the response.
  form: llm
  default: false
extra:
  python:
    source: tools/mrscraper_get_screenshot.py
